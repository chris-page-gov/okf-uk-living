  - public-private-transport-scotland-handoff
  - public-private-transport-wales-handoff
  - public-private-transport-northern-ireland-handoff
situations:
- A vehicle may enter a charging clean-air zone.
user_needs:
- Find the official zone and vehicle checker and avoid confusing local clean-air
- congestion and low-emission schemes.
interaction_boundary: Source-linked discovery and process navigation only; the bundle does not decide
  eligibility, diagnosis, treatment, safeguarding action or legal outcome.
