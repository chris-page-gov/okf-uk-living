journeys:
  ordinary:
    id: ordinary-source-linked-route
    entry_state: A vehicle may enter a charging clean-air zone.
    outcome: Check the vehicle and journey against the current official zone service, pay where required
      and retain payment or exemption evidence.
    steps:
    - id: select-current-jurisdiction-route
      interaction: Select the current official route for the place and situation.
      provider: organisation:official-service-directory
      requirements:
        state: supported
        summary: Location and the source-defined situation boundary.
      evidence:
        state: not_published_by_source
        reason: Evidence is determined by the selected current route.
      rule:
        state: supported
        summary: Jurisdiction and provider rules remain separate and source-defined.
      channel:
        state: supported
        summary: Official web, telephone or local handoff shown by the selected source.
      cost:
        state: not_published_by_source
        reason: No cross-route cost is asserted; check the current official source.
      time:
        state: not_published_by_source
        reason: No cross-route deadline is asserted; check the current official source.
      output:
        state: supported
        summary: A current authoritative route and provider handoff.
      outcome:
        state: supported
        summary: The user can continue without assuming four-nation equivalence.
      redress:
        state: supported
        summary: Use the complaint, review or urgent route published by the selected authority.
      assertion_status: normalized
      sources: *id001
    - id: follow-current-official-instructions
      interaction: Follow the selected source to pay a clean air zone charge and retain its output or
        reference.
      provider: organisation:selected-authoritative-provider
      requirements:
        state: supported
        summary: The source-linked route identifies the responsible service and publishes the current
          requirements, evidence, channel, costs and timing for that jurisdiction.
      evidence:
        state: supported
        summary: Only the evidence requested by the selected current source.
      rule:
        state: supported
        summary: The responsible authority or provider decides the real case.
      channel:
        state: supported
        summary: The channel published by the current source.
      cost:
        state: not_published_by_source
        reason: Cost is deliberately not generalized across routes.
      time:
        state: not_published_by_source
        reason: Timing is deliberately not generalized across routes.
      output:
        state: supported
        summary: Source-defined confirmation, referral, decision or next-step information.
      outcome:
        state: supported
        summary: Check the vehicle and journey against the current official zone service, pay where required
          and retain payment or exemption evidence.
      redress:
        state: supported
        summary: Escalate through the current provider's review, complaint or statutory redress route.
      assertion_status: normalized
      sources: *id001
  exceptions:
  - id: exception-or-route-failure
    entry_state: The standard route is unavailable, does not fit, or indicates an urgent or specialist
      boundary.
    outcome: The accountable exception, urgent or redress route is identified without making the decision
      locally.
    steps:
    - id: resolve-route-boundary-or-failure
      interaction: Stop and use the current authority's exception, urgent, safeguarding or complaint handoff
        when the ordinary route does not fit.
      provider: organisation:responsible-authority-or-redress-body
      requirements:
        state: supported
        summary: The source-defined exception or failure boundary.
      evidence:
        state: not_published_by_source
        reason: The responsible authority states what evidence is needed for the exception.
      rule:
        state: supported
        summary: No eligibility, clinical, safeguarding or legal decision is made by this bundle.
      channel:
        state: supported
        summary: Current official exception, urgent or complaint route.
      cost:
        state: not_published_by_source
        reason: Consult the current authority route.
      time:
        state: not_published_by_source
        reason: Urgency and deadlines are case- and route-specific.
      output:
        state: supported
        summary: An authority decision, alternate route or recorded unresolved state.
      outcome:
        state: supported
        summary: The user is handed to the accountable route without a fabricated answer.
      redress:
        state: supported
        summary: Current provider complaint, statutory review, regulator or ombudsman route as applicable.
      assertion_status: normalized
      sources: *id001
