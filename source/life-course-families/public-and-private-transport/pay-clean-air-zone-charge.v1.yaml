title: Pay a clean air zone charge
aliases:
- check clean air zone
- emissions zone payment
- CAZ charge
description: Check the vehicle and journey against the current official zone service, pay where required
  and retain payment or exemption evidence.
status: population_complete
assertion_status: normalized
life_course_domain: public-and-private-transport
enclosing_processes:
- id: own-and-use-a-road-vehicle
