schema: life-course-family.v1
id: apply-for-home-adaptation
title: Apply for a home adaptation
aliases:
- disabled facilities grant
- adapt home for disability
- home accessibility changes
description: Request the applicable needs, housing and grant assessments before arranging eligible accessibility
  work.
status: population_complete
assertion_status: normalized
life_course_domain: housing-and-community
enclosing_processes:
- id: adapt-develop-and-protect-home-and-neighbourhood
  assertion_status: normalized
  sources: &id001
  - apply-for-home-adaptation-primary
  - housing-community-scotland-handoff
  - housing-community-wales-handoff
  - housing-community-northern-ireland-handoff
situations:
- A disabled person or household needs changes that support safe access or independent living at home.
user_needs:
- Coordinate social-care
- landlord
- grant and building-work boundaries without the bundle assessing clinical need.
interaction_boundary: Source-linked discovery and process navigation only; the bundle does not decide
  eligibility, diagnosis, treatment, safeguarding action or legal outcome.
applicability:
- jurisdiction: England
  state: supported
  route_variants:
  - id: england-current-official-route
    provider: organisation:england-official-route-provider
