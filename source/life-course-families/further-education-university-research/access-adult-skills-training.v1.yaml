limitations:
- Original summaries and links only; no upstream source response or snapshot is retained.
- A national discovery handoff locates the current route but does not establish a leaf rule, eligibility
  condition, cost or deadline.
- Jurisdictions, providers and exceptions remain separate even where labels are similar.
- Specialist review is required before legal, clinical, safeguarding or high-impact operational claims
  are release-grade.
review:
  population_gate: complete
  specialist_review: required
narrative:
  markdown: services/access-adult-skills-training.md
  process_context: Enter and fund post-school study
