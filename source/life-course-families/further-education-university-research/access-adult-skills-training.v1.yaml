schema: life-course-family.v1
id: access-adult-skills-training
title: Access adult skills training
aliases:
- free adult courses
- retrain with government-funded skills
description: Find a current funded adult-skills course and apply through an accountable provider.
status: population_complete
assertion_status: normalized
life_course_domain: further-education-university-research
enclosing_processes:
- id: enter-and-fund-post-school-study
  assertion_status: normalized
  sources: &id001
  - access-adult-skills-training-primary
  - post-school-study-scotland-handoff
  - post-school-study-wales-handoff
  - post-school-study-northern-ireland-handoff
situations:
- An adult wants to gain skills
- retrain or improve employment prospects.
user_needs:
- Locate governed course and funding information before selecting a provider.
interaction_boundary: Source-linked discovery and process navigation only; the bundle does not decide
  eligibility, diagnosis, treatment, safeguarding action or legal outcome.
