schema: life-course-family.v1
id: get-healthy-start-support
title: Get Healthy Start support
aliases:
- Healthy Start card
- help to buy healthy food and vitamins
description: Use the current Healthy Start or nation-specific equivalent route for food, milk and vitamin
  support.
status: population_complete
assertion_status: normalized
life_course_domain: before-birth-and-starting-family
enclosing_processes:
- id: pregnancy-maternity-and-workplace-support
  assertion_status: normalized
  sources: &id001
  - get-healthy-start-support-primary
  - before-birth-scotland-handoff
situations:
- A pregnant person or family with a young child wants to check the relevant healthy-food support route.
user_needs:
- Find the current programme for the nation and submit a claim without the bundle deciding eligibility.
interaction_boundary: Source-linked discovery and process navigation only; the bundle does not decide
  eligibility, diagnosis, treatment, safeguarding action or legal outcome.
applicability:
- jurisdiction: England
  state: supported
  route_variants:
  - id: england-current-official-route
    provider: organisation:england-official-route-provider
    primary_source: get-healthy-start-support-primary
    route_kind: topic-specific-authoritative-page
  sources:
  - get-healthy-start-support-primary
- jurisdiction: Scotland
  state: supported
  route_variants:
  - id: scotland-current-official-route
    provider: organisation:scotland-official-route-provider
    primary_source: before-birth-scotland-handoff
    route_kind: authoritative-national-discovery-handoff
  sources:
  - before-birth-scotland-handoff
- jurisdiction: Wales
  state: supported
  route_variants:
  - id: wales-current-official-route
    provider: organisation:wales-official-route-provider
    primary_source: get-healthy-start-support-primary
    route_kind: topic-specific-authoritative-page
  sources:
  - get-healthy-start-support-primary
- jurisdiction: Northern Ireland
  state: supported
  route_variants:
  - id: northern-ireland-current-official-route
    provider: organisation:northern-ireland-official-route-provider
    primary_source: get-healthy-start-support-primary
    route_kind: topic-specific-authoritative-page
  sources:
  - get-healthy-start-support-primary
actors:
- id: organisation:england-official-route-provider
  role: authoritative_service_or_discovery_handoff
  authority_status: normalized
  sources:
  - get-healthy-start-support-primary
- id: organisation:scotland-official-route-provider
  role: authoritative_service_or_discovery_handoff
  authority_status: normalized
  sources:
  - before-birth-scotland-handoff
- id: organisation:wales-official-route-provider
  role: authoritative_service_or_discovery_handoff
  authority_status: normalized
  sources:
  - get-healthy-start-support-primary
- id: organisation:northern-ireland-official-route-provider
  role: authoritative_service_or_discovery_handoff
  authority_status: normalized
  sources:
  - get-healthy-start-support-primary
journeys:
  ordinary:
    id: ordinary-source-linked-route
    entry_state: A pregnant person or family with a young child wants to check the relevant healthy-food
      support route.
    outcome: Use the current Healthy Start or nation-specific equivalent route for food, milk and vitamin
      support.
    steps:
    - id: select-current-jurisdiction-route
      interaction: Select the current official route for the place and situation.
      provider: organisation:official-service-directory
      requirements:
        state: supported
        summary: Location and the source-defined situation boundary.
      evidence:
        state: not_published_by_source
        reason: Evidence is determined by the selected current route.
      rule:
        state: supported
        summary: Jurisdiction and provider rules remain separate and source-defined.
      channel:
        state: supported
        summary: Official web, telephone or local handoff shown by the selected source.
      cost:
        state: not_published_by_source
        reason: No cross-route cost is asserted; check the current official source.
      time:
        state: not_published_by_source
        reason: No cross-route deadline is asserted; check the current official source.
      output:
        state: supported
        summary: A current authoritative route and provider handoff.
      outcome:
        state: supported
        summary: The user can continue without assuming four-nation equivalence.
      redress:
        state: supported
        summary: Use the complaint, review or urgent route published by the selected authority.
      assertion_status: normalized
      sources: *id001
    - id: follow-current-official-instructions
      interaction: Follow the selected source to get healthy start support and retain its output or reference.
      provider: organisation:selected-authoritative-provider
      requirements:
        state: supported
        summary: The source-linked route identifies the responsible service and publishes the current
          requirements, evidence, channel, costs and timing for that jurisdiction.
      evidence:
        state: supported
        summary: Only the evidence requested by the selected current source.
      rule:
        state: supported
        summary: The responsible authority or provider decides the real case.
      channel:
        state: supported
        summary: The channel published by the current source.
      cost:
        state: not_published_by_source
        reason: Cost is deliberately not generalized across routes.
      time:
        state: not_published_by_source
        reason: Timing is deliberately not generalized across routes.
      output:
        state: supported
        summary: Source-defined confirmation, referral, decision or next-step information.
      outcome:
        state: supported
        summary: Use the current Healthy Start or nation-specific equivalent route for food, milk and
          vitamin support.
      redress:
        state: supported
        summary: Escalate through the current provider's review, complaint or statutory redress route.
      assertion_status: normalized
      sources: *id001
  exceptions:
  - id: exception-or-route-failure
    entry_state: The standard route is unavailable, does not fit, or indicates an urgent or specialist
      boundary.
    outcome: The accountable exception, urgent or redress route is identified without making the decision
      locally.
    steps:
    - id: resolve-route-boundary-or-failure
      interaction: Stop and use the current authority's exception, urgent, safeguarding or complaint handoff
        when the ordinary route does not fit.
      provider: organisation:responsible-authority-or-redress-body
      requirements:
        state: supported
        summary: The source-defined exception or failure boundary.
      evidence:
        state: not_published_by_source
        reason: The responsible authority states what evidence is needed for the exception.
      rule:
        state: supported
        summary: No eligibility, clinical, safeguarding or legal decision is made by this bundle.
      channel:
        state: supported
        summary: Current official exception, urgent or complaint route.
      cost:
        state: not_published_by_source
        reason: Consult the current authority route.
      time:
        state: not_published_by_source
        reason: Urgency and deadlines are case- and route-specific.
      output:
        state: supported
        summary: An authority decision, alternate route or recorded unresolved state.
      outcome:
        state: supported
        summary: The user is handed to the accountable route without a fabricated answer.
      redress:
        state: supported
        summary: Current provider complaint, statutory review, regulator or ombudsman route as applicable.
      assertion_status: normalized
      sources: *id001
dependencies: []
sources:
- id: get-healthy-start-support-primary
  register: source/domain-registers/before-birth-and-starting-family.v1.yaml
- id: before-birth-scotland-handoff
  register: source/domain-registers/before-birth-and-starting-family.v1.yaml
limitations:
- Original summaries and links only; no upstream source response or snapshot is retained.
- A national discovery handoff locates the current route but does not establish a leaf rule, eligibility
  condition, cost or deadline.
- Jurisdictions, providers and exceptions remain separate even where labels are similar.
- Specialist review is required before legal, clinical, safeguarding or high-impact operational claims
  are release-grade.
review:
  population_gate: complete
  specialist_review: required
narrative:
  markdown: services/get-healthy-start-support.md
  process_context: Pregnancy, maternity and workplace support
