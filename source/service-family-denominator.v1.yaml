service_family_denominator_version: service-family-denominator.v1
status: owner_approved
decision_date: "2026-08-07"
approved_by: owner:chris-page-gov

decision:
  target_range: 250-400
  declared_family_count: 293
  assertion_status: normalized
  naming_rule: stable_kebab_case_user_need_or_public_capability
  source_inventory: source/exhaustive-reference-inventory.v1.yaml
  authorizes:
    - staged_leaf_reference_registration_against_named_families
    - local_authority_and_regulator_denominator_research
    - gap_and_coverage_measurement_against_the_named_families
  does_not_authorize:
    - source_snapshots
    - source_content_redistribution
    - personalized_eligibility_legal_or_medical_decisions
    - unsupported_cross_jurisdiction_equivalence
    - ci_or_publication

waves:
  - id: wave-1
    purpose: Core life events, high-use routes and dependencies needed to expand the three proven slices.
  - id: wave-2
    purpose: Evidence, exception, redress and locally delivered routes across all domains.
  - id: wave-3
    purpose: Specialist, cross-border, long-tail and private-dependency handoffs needed for full coverage.

implemented_families:
  - report-missed-rubbish-collection
  - learn-to-drive-car
  - respond-to-speeding-notice
  - register-a-death
  - notify-organisations-after-a-death
  - administer-an-estate

scope_classes:
  national-and-devolved: Route requires a UK, Great Britain, England, Scotland, Wales or Northern Ireland evidence decision.
  local-authority: Responsibility depends on an identified local authority or statutory local provider.
  mixed-public-private: A public route has a required or common regulated private-sector dependency.
  regulated-private: Discovery starts with an official regulator, mandatory register or statutory redress body rather than provider marketing.
  cross-border: Route crosses UK or international jurisdiction and requires explicit territorial evidence.

