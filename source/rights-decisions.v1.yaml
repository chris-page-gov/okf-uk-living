rights_decisions_version: rights-decisions.v1
status: approved
decided_at: "2026-08-07"
decided_by: owner:chris-page-gov
scope: three_bounded_vertical_slice_source_registers_and_mapping_references

repository:
  code:
    licence: MIT
    redistribution_allowed: true
    evidence:
      - kind: owner_instruction
        resource: LICENSE
        observed_at: "2026-08-07"
  documentation:
    licence: MIT
    redistribution_allowed: true
    evidence:
      - kind: owner_instruction
        resource: LICENSE
        observed_at: "2026-08-07"
  ontology_terms:
    licence: MIT
    redistribution_allowed: true
    evidence:
      - kind: owner_instruction
        resource: LICENSE
        observed_at: "2026-08-07"
  limitation: repository_authored_material_only_no_upstream_relicensing

use_policy:
  source_content: linked_reference_and_original_summary_only
  source_content_redistribution_allowed: false
  snapshots_acquired: false
  snapshot_redistribution_allowed: false
  future_snapshot_rule: >-
    Record the exact source licence, version, attribution, exclusions,
    acquisition time and checksum before acquisition or redistribution.
  generated_projections:
    redistribution_allowed: true
    licence: MIT
    condition: >-
      Projection contains only repository-authored structure, original
      summaries, unprotected facts and links; embedded upstream expression
      retains its upstream terms and requires a new compatibility decision.
  publication_allowed: false
  publication_rule: Explicit owner request and release validation remain required.

attribution:
  ogl_v3_fallback: Contains public sector information licensed under the Open Government Licence v3.0.
  ogl_v3_requirements:
    - use_provider_specified_attribution_when_supplied
    - identify_information_provider_and_source
    - link_to_source_and_ogl_v3_where_possible
    - do_not_imply_official_status_or_endorsement
    - do_not_use_information_in_a_misleading_way
    - exclude_personal_data_logos_crests_royal_arms_and_third_party_rights
  notice: NOTICE.md
  evidence:
    - resource: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
      observed_at: "2026-08-07"

licence_families:
  ogl-uk-3.0:
    licence: OGL-UK-3.0
    redistribution_permission: permitted_with_attribution_and_exclusions
    project_use: linked_reference_and_original_summary_only
  ogl-provider-version-not-expressly-recorded:
    licence: Open-Government-Licence-version-not-recorded
    redistribution_permission: not_relied_on
    project_use: linked_reference_and_original_summary_only
  provider-bespoke-reuse:
    licence: LicenseRef-Provider-Bespoke
    redistribution_permission: subject_to_provider_conditions
    project_use: linked_reference_and_original_summary_only
  provider-copyright-restricted:
    licence: LicenseRef-Provider-Copyright
    redistribution_permission: not_permitted_without_separate_permission
    project_use: linked_reference_and_original_summary_only
  no-open-licence-established:
    licence: LicenseRef-No-Open-Licence-Established
    redistribution_permission: not_permitted_without_separate_permission
    project_use: linked_reference_and_original_summary_only

