    source:
      <<: *source_defaults
      id: access-employment-retraining-primary
      title: "Career skills and training"
      owner: "Department for Education"
      authority_role: england_career_training_discovery_guidance
      resource: https://www.gov.uk/career-skills-and-training
      coverage: "Routes people in England to current skills assessments, courses and funding."
      exclusions: "Does not recommend a provider or guarantee funding or employment."
  - <<: *family_defaults
    id: volunteer-in-the-uk
    title: Volunteer in the UK
    aliases: [find volunteering, unpaid community role]
    description: Find a legitimate volunteer opportunity and understand the boundary between volunteering, expenses and employment.
    situations: [A person wants to give unpaid time to an organisation or community.]
    user_needs: [Check the organisation, safeguarding, expenses and benefit or immigration implications.]
    dependency: volunteer-involving-organisation
    source:
      <<: *source_defaults
      id: volunteer-in-the-uk-primary
      title: "Volunteer placements, rights and expenses"
      owner: "Department for Culture Media and Sport"
      authority_role: uk_volunteering_rights_guidance
      resource: https://www.gov.uk/volunteering
      coverage: "Explains UK volunteer rights, expenses and employment-status boundaries."
      exclusions: "Does not recommend an organisation or decide employment, benefit or immigration status."
  - <<: *family_defaults
    id: resolve-recruitment-discrimination
    title: Resolve recruitment discrimination
    aliases: [discrimination in job application, unfair hiring complaint]
    description: Retain recruitment evidence and use advice, conciliation or legal routes when unlawful discrimination may have occurred.
    situations: [An applicant believes recruitment treatment may be discriminatory.]
    user_needs: [Find the correct equality, time-limit and redress route without receiving a legal conclusion locally.]
    source:
      <<: *source_defaults
      id: resolve-recruitment-discrimination-primary
      title: "Discrimination, your rights, what you can do"
      owner: "Government Equalities Office"
      authority_role: great_britain_discrimination_redress_guidance
      resource: https://www.gov.uk/discrimination-your-rights/what-you-can-do
      coverage: "Routes Great Britain users to advice and legal remedies for possible discrimination."
      exclusions: "Does not determine unlawfulness or calculate a deadline or remedy."
