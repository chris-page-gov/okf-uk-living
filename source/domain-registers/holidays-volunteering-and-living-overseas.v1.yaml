families:
  - <<: *family_defaults
    id: renew-passport
    title: Renew a passport
    aliases: [replace expired passport, renew UK passport, passport running out]
    description: Check passport validity and destination timing, use the current renewal route and retain the application and delivery references.
    situations: [A British passport holder needs a replacement before travel or other identity use.]
    user_needs: [Use the correct adult, child, lost, damaged or overseas route without assuming processing time.]
    source:
      <<: *source_defaults
      id: renew-passport-primary
      title: Renew or replace your adult passport
      owner: HM Passport Office
      authority_role: uk_adult_passport_renewal
      resource: https://www.gov.uk/renew-adult-passport
      coverage: Routes eligible adult British passport holders through current renewal and replacement steps.
      exclusions: Does not guarantee identity, nationality, processing time, travel acceptance or a child or overseas route.
  - <<: *family_defaults
    id: check-entry-requirements
    title: Check entry requirements
    aliases: [visa rules for destination, passport validity abroad, destination entry rules]
    description: Select the destination advice, confirm passport, visa, transit and border requirements with the responsible authorities and recheck before travel.
    situations: [A traveller needs to understand the conditions for entering or transiting another country.]
    user_needs: [Find authoritative current requirements without the bundle deciding admissibility.]
    source:
      <<: *source_defaults
      id: check-entry-requirements-primary
      title: Foreign travel advice
      owner: Foreign, Commonwealth and Development Office
      authority_role: uk_destination_entry_advice_handoff
      resource: https://www.gov.uk/foreign-travel-advice
      coverage: Routes travellers to country pages containing current entry, passport, visa and transit advice.
      exclusions: Does not grant entry, replace the destination authority or guarantee that conditions will not change.
  - <<: *family_defaults
    id: check-foreign-travel-advice
    title: Check foreign travel advice
    aliases: [is destination safe, FCDO travel warning, country travel advice]
    description: Read the current destination advice, understand its geographic and risk scope and review insurance and contingency implications before and during travel.
    situations: [A traveller needs current official safety, security, health or disruption information for a destination.]
    user_needs: [Use dated official advice without turning it into a personal risk decision.]
    source:
      <<: *source_defaults
      id: check-foreign-travel-advice-primary
      title: Foreign travel advice
      owner: Foreign, Commonwealth and Development Office
      authority_role: uk_foreign_travel_advice
      resource: https://www.gov.uk/foreign-travel-advice
      coverage: Publishes current UK government destination advice and significant warnings.
      exclusions: Does not guarantee safety, cover every local condition or make an insurance decision.
  - <<: *family_defaults
    id: obtain-ghic-or-ehic
    title: Obtain a GHIC or EHIC
    aliases: [global health insurance card, European health insurance card, healthcare card abroad]
    description: Check which reciprocal-healthcare card applies, apply through the official route and understand that travel insurance and local charges may still be required.
