      <<: *source_defaults
      id: manage-workplace-pension-in-retirement-primary
      title: Workplace pensions
      owner: Department for Work and Pensions
      authority_role: uk_workplace_pension_guidance
      resource: https://www.gov.uk/workplace-pensions
      coverage: Introduces workplace pension participation, scheme and retirement-information routes.
      exclusions: Does not trace every scheme, recommend options, calculate tax or provide regulated financial advice.
