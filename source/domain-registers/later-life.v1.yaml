route_sources:
  - <<: *source_defaults
    id: later-life-scotland-handoff
    jurisdiction: Scotland
    title: Benefits in Scotland
    owner: Scottish Government
    authority_role: scotland_later_life_benefit_handoff
    resource: https://www.mygov.scot/browse/benefits
    coverage: Routes people to current Scottish benefit, disability and older-person support information.
    exclusions: Does not decide entitlement, pension, care, legal planning or health needs.
  - <<: *source_defaults
    id: later-life-wales-handoff
    jurisdiction: Wales
    title: Social care in Wales
    owner: Welsh Government
    authority_role: wales_later_life_care_handoff
    resource: https://www.gov.wales/social-care
    coverage: Routes people to current Welsh social-care policy, support and service information.
    exclusions: Does not assess needs, identify a local service, decide funding or cover every pension and legal-planning route.
  - <<: *source_defaults
    id: later-life-northern-ireland-handoff
    jurisdiction: Northern Ireland
    title: Pensions and retirement planning
    owner: Northern Ireland Executive
    authority_role: northern_ireland_retirement_handoff
    resource: https://www.nidirect.gov.uk/information-and-services/pensions-and-retirement-planning
    coverage: Routes people to current Northern Ireland pension and retirement-planning information.
    exclusions: Does not decide pension entitlement, care, health or legal-planning needs.
families:
  - <<: *family_defaults
    primary_jurisdictions: [England, Scotland, Wales, Northern Ireland]
    id: get-state-pension-forecast
    title: Get a State Pension forecast
    aliases: [check future State Pension, pension forecast online, expected State Pension]
    description: Use the official forecast service, review the contribution record and follow its correction or voluntary-contribution handoffs where relevant.
    situations: [A person wants an estimate of their future UK State Pension and qualifying record.]
    user_needs: [Understand that a forecast is not a guarantee and may require record correction or advice.]
    source:
      <<: *source_defaults
      id: get-state-pension-forecast-primary
      title: Check your State Pension forecast
      owner: Department for Work and Pensions
      authority_role: uk_state_pension_forecast
      resource: https://www.gov.uk/check-state-pension
      coverage: Provides the current forecast route and National Insurance record handoffs.
      exclusions: Does not guarantee a future amount, give financial advice or resolve every record issue.
  - <<: *family_defaults
    primary_jurisdictions: [England, Scotland, Wales, Northern Ireland]
    id: claim-state-pension
    title: Claim State Pension
    aliases: [start State Pension, defer pension claim, claim retirement pension]
    description: Check invitation and claim timing, use the applicable online, telephone or postal route and retain the decision and payment information.
    situations: [A person is approaching or has passed State Pension age and wants to claim.]
    user_needs: [Use the current claim route without the bundle calculating age, amount, deferral or tax.]
    source:
      <<: *source_defaults
      id: claim-state-pension-primary
      title: Get your State Pension
      owner: Department for Work and Pensions
      authority_role: uk_state_pension_claim
      resource: https://www.gov.uk/get-state-pension
      coverage: Explains current UK State Pension claim, deferral and payment routes.
      exclusions: Does not calculate entitlement, choose a claim date, give tax advice or decide an appeal.
  - <<: *family_defaults
    primary_jurisdictions: [England, Scotland, Wales]
    id: claim-pension-credit
    title: Claim Pension Credit
    aliases: [top up retirement income, guarantee credit, pensioner income benefit]
    description: Check the current qualifying framework and use the claim route with income, savings, housing and partner information requested by the authority.
    situations: [A person over the qualifying age has a low retirement income and wants to explore Pension Credit.]
    user_needs: [Reach the official calculation and decision process without a local entitlement result.]
    source:
      <<: *source_defaults
      id: claim-pension-credit-primary
      title: Pension Credit
      owner: Department for Work and Pensions
      authority_role: great_britain_pension_credit
      resource: https://www.gov.uk/pension-credit
      coverage: Routes Great Britain claimants to current Pension Credit conditions, calculation and claim services.
      exclusions: Does not cover the Northern Ireland claim route, calculate entitlement or decide a challenge.
  - <<: *family_defaults
    primary_jurisdictions: [England, Scotland, Wales, Northern Ireland]
    id: manage-workplace-pension-in-retirement
    title: Manage a workplace pension in retirement
    aliases: [take workplace pension, retirement pension options, draw pension pot]
    description: Find each scheme, obtain its options and regulated guidance, understand tax and benefit effects and make decisions through the scheme provider.
    situations: [A person is approaching retirement or needs to use, transfer or trace workplace pension benefits.]
    user_needs: [Find scheme and guidance routes without an investment, transfer or withdrawal recommendation.]
    dependency: pension-scheme-and-fca-regulated-adviser
