_family_defaults: &family_defaults
  primary_jurisdictions: [England, Scotland, Wales, Northern Ireland]
  specialist_review: required
route_sources:
  - <<: *source_defaults
    id: money-tax-benefits-scotland-handoff
    jurisdiction: Scotland
    title: Money and tax in Scotland
    owner: Scottish Government
    authority_role: scotland_money_support_discovery_handoff
    resource: https://www.mygov.scot/browse/money-tax
    coverage: Routes people to current Scottish money, tax and financial-support services.
    exclusions: Does not calculate liability, entitlement, debt or a challenge outcome.
  - <<: *source_defaults
    id: money-tax-benefits-wales-handoff
    jurisdiction: Wales
    title: Money and financial inclusion in Wales
    owner: Welsh Government
    authority_role: wales_money_support_discovery_handoff
    resource: https://www.gov.wales/money-and-financial-inclusion
    coverage: Routes people to current Welsh financial-support policy and services.
    exclusions: Does not calculate liability, entitlement, debt or a challenge outcome.
  - <<: *source_defaults
    id: money-tax-benefits-northern-ireland-handoff
    jurisdiction: Northern Ireland
    title: Money, tax and benefits in Northern Ireland
    owner: Northern Ireland Executive
    authority_role: northern_ireland_money_support_discovery_handoff
    resource: https://www.nidirect.gov.uk/information-and-services/money-tax-and-benefits
    coverage: Routes people to current Northern Ireland money, tax and benefit services.
    exclusions: Does not calculate liability, entitlement, debt or a challenge outcome.
families:
  - <<: *family_defaults
    id: register-for-income-tax
    title: Register for Income Tax
    aliases: [tell HMRC about untaxed income, start paying income tax]
    description: Identify the correct PAYE, Self Assessment or other HMRC route when income is not already handled correctly.
    situations: [A person has income or a change that may require Income Tax registration or notification.]
    user_needs: [Find the responsible tax route and retain HMRC confirmation without calculating liability locally.]
    source:
      <<: *source_defaults
      id: register-for-income-tax-primary
      title: "Income Tax"
      owner: "HM Revenue and Customs"
      authority_role: uk_income_tax_discovery_guidance
      resource: https://www.gov.uk/income-tax
      coverage: "Routes people to current Income Tax, PAYE and Self Assessment information."
      exclusions: "Does not calculate liability or decide which notification is required."
  - <<: *family_defaults
    id: get-national-insurance-record
    title: Get a National Insurance record
    aliases: [check NI contributions, view national insurance gaps]
    description: View contribution years and use HMRC correction or voluntary-contribution handoffs for apparent gaps.
    situations: [A person needs to understand the National Insurance record used for state benefits or pension.]
    user_needs: [Access the official record and keep forecast, correction and payment decisions separate.]
    source:
      <<: *source_defaults
      id: get-national-insurance-record-primary
      title: "Check your National Insurance record"
      owner: "HM Revenue and Customs"
      authority_role: uk_national_insurance_record_service
      resource: https://www.gov.uk/check-national-insurance-record
      coverage: "Provides the official contribution-year and gap-viewing service."
      exclusions: "Does not alter a record or advise whether voluntary contributions are worthwhile."
  - <<: *family_defaults
    id: file-self-assessment
    title: File Self Assessment
    aliases: [submit tax return, self assessment deadline]
    description: Register if required, keep source records, submit the return and retain calculation, payment and amendment outputs.
    situations: [A person must or may need to submit a Self Assessment tax return.]
    user_needs: [Follow current registration, filing, payment and correction routes without tax advice from the bundle.]
    source:
      <<: *source_defaults
      id: file-self-assessment-primary
      title: "Self Assessment tax returns"
      owner: "HM Revenue and Customs"
      authority_role: uk_self_assessment_service
      resource: https://www.gov.uk/self-assessment-tax-returns
      coverage: "Provides current registration, return and payment handoffs."
      exclusions: "Does not decide filing need, calculate tax or provide tax advice."
  - <<: *family_defaults
    id: register-for-vat
    title: Register for VAT
    aliases: [VAT registration threshold, get a VAT number]
    description: Check the current registration boundary and submit business evidence through HMRC's VAT route.
    situations: [A business or person needs to determine whether or when to register for VAT.]
    user_needs: [Find mandatory, voluntary and exception routes without calculating taxable turnover locally.]
    source:
      <<: *source_defaults
      id: register-for-vat-primary
      title: "Register for VAT"
      owner: "HM Revenue and Customs"
      authority_role: uk_vat_registration_service
      resource: https://www.gov.uk/vat-registration
      coverage: "Explains current VAT registration thresholds and application routes."
      exclusions: "Does not calculate taxable turnover or decide registration, exemption or liability."
  - <<: *family_defaults
    id: pay-council-tax
    title: Pay Council Tax
    aliases: [council tax bill, local property tax payment]
    description: Identify the billing authority, understand the bill and use payment, discount, support or challenge routes.
    situations: [A household has or expects a Council Tax or domestic-rates liability.]
    user_needs: [Find the correct local authority and keep valuation, liability, support and collection decisions distinct.]
    source:
      <<: *source_defaults
      id: pay-council-tax-primary
      title: "Council Tax"
      owner: "Ministry of Housing Communities and Local Government"
      authority_role: england_wales_council_tax_guidance
      resource: https://www.gov.uk/council-tax
      coverage: "Routes England and Wales users to billing, discounts, appeals and local payment."
      exclusions: "Scotland and Northern Ireland have distinct local-tax routes; no bill is calculated here."
  - <<: *family_defaults
    id: manage-student-loan-repayment
    title: Manage student loan repayment
    aliases: [repay student finance, student loan deductions]
    description: Identify the repayment plan and use payroll, Self Assessment or overseas repayment routes for the account.
    situations: [A borrower needs to understand or correct student-loan repayments.]
    user_needs: [Use the official plan, balance and deduction routes without financial advice from the bundle.]
    source:
      <<: *source_defaults
      id: manage-student-loan-repayment-primary
      title: "Repaying your student loan"
      owner: "Student Loans Company"
      authority_role: uk_student_loan_repayment_guidance
      resource: https://www.gov.uk/repaying-your-student-loan
      coverage: "Explains plan-specific repayment, payroll, tax-return and overseas routes."
      exclusions: "Does not calculate a balance or advise early repayment."
  - <<: *family_defaults
    id: claim-tax-refund
    title: Claim a tax refund
    aliases: [income tax overpayment, get tax back from HMRC]
    description: Use the correct HMRC refund route for the tax type and retain calculation, payment or refusal outputs.
    situations: [A person believes too much tax has been paid.]
    user_needs: [Select the source-defined refund route and know how to query or challenge the result.]
    source:
      <<: *source_defaults
      id: claim-tax-refund-primary
      title: "Claim a tax refund"
      owner: "HM Revenue and Customs"
      authority_role: uk_tax_refund_discovery_guidance
      resource: https://www.gov.uk/claim-tax-refund
      coverage: "Routes users to current refund services by tax and circumstance."
      exclusions: "Does not establish overpayment, calculate a refund or request personal credentials."
  - <<: *family_defaults
    id: claim-universal-credit
    title: Claim Universal Credit
    aliases: [apply for UC, means-tested living cost benefit]
    description: Check the current claim boundary, submit the live claim and retain commitment, payment and review records.
    situations: [A household on a low income or out of work needs to check Universal Credit.]
    user_needs: [Use the responsible service without calculating entitlement or substituting for advice.]
    source:
      <<: *source_defaults
      id: claim-universal-credit-primary
      title: "Universal Credit"
      owner: "Department for Work and Pensions"
      authority_role: universal_credit_service
      resource: https://www.gov.uk/universal-credit
      coverage: "Provides the current Universal Credit overview, claim and account handoffs."
      exclusions: "Does not calculate entitlement or decide payment, sanctions or review."
  - <<: *family_defaults
    id: claim-disability-benefit
    title: Claim a disability benefit
    aliases: [disability payment application, benefits for disabled people]
    description: Select the correct national and age-specific benefit route and follow assessment, decision and challenge handoffs.
    situations: [A disabled person or person with a health condition needs to check financial support.]
    user_needs: [Distinguish benefit systems and retain evidence and decision outputs without a local health or entitlement assessment.]
    source:
      <<: *source_defaults
      id: claim-disability-benefit-primary
      title: "Financial help if you are disabled"
      owner: "Department for Work and Pensions"
      authority_role: disability_benefit_discovery_guidance
      resource: https://www.gov.uk/financial-help-disabled
      coverage: "Routes people to current disability-related benefit and support services."
      exclusions: "Does not diagnose, select a national benefit or determine entitlement."
  - <<: *family_defaults
    id: report-benefit-change-of-circumstances
    title: Report a benefit change of circumstances
    aliases: [tell benefits office about a change, update benefit claim]
    description: Identify each affected benefit and report the change through its accountable service, retaining confirmation.
    situations: [A claimant's personal, household, work, health or financial circumstances have changed.]
    user_needs: [Find current notification routes and avoid assuming one report updates every authority.]
    source:
      <<: *source_defaults
      id: report-benefit-change-of-circumstances-primary
      title: "Benefits, report a change in circumstances"
      owner: "Department for Work and Pensions"
      authority_role: benefit_change_discovery_guidance
      resource: https://www.gov.uk/report-benefits-change-circumstances
      coverage: "Routes claimants to source-specific change reporting and explains overpayment risk."
      exclusions: "Does not identify every affected service or decide benefit consequences."
  - <<: *family_defaults
    id: get-debt-advice-and-relief
    title: Get debt advice and relief
    aliases: [help with debts, debt management options]
    description: Use free or regulated advice to compare formal and informal debt solutions before committing.
    situations: [A person cannot meet debts or needs a sustainable repayment or relief route.]
    user_needs: [Start with public options and regulated advice rather than provider marketing.]
    dependency: regulated-debt-advice-or-insolvency-provider
    source:
      <<: *source_defaults
      id: get-debt-advice-and-relief-primary
      title: "Options for dealing with your debts"
      owner: "Insolvency Service"
      authority_role: england_wales_debt_solution_guidance
      resource: https://www.gov.uk/options-for-dealing-with-your-debts
      coverage: "Compares official England and Wales debt-management and insolvency routes."
      exclusions: "Does not recommend a provider, give financial advice or establish devolved debt law."
  - <<: *family_defaults
    id: enter-personal-insolvency
    title: Enter personal insolvency
    aliases: [apply for bankruptcy, formal insolvency for debts]
    description: Use the applicable formal insolvency route only after advice, then retain adjudicator, trustee and creditor outputs.
    situations: [A person is considering bankruptcy or another formal insolvency process.]
    user_needs: [Understand territorial routes, consequences, costs and challenge boundaries before applying.]
    dependency: regulated-insolvency-practitioner-or-official-receiver
    source:
      <<: *source_defaults
      id: enter-personal-insolvency-primary
      title: "Apply for bankruptcy"
      owner: "Insolvency Service"
      authority_role: england_wales_online_bankruptcy_service
      resource: https://www.gov.uk/apply-for-bankruptcy
      coverage: "Provides the England and Wales online bankruptcy application and consequence guidance."
      exclusions: "Scotland and Northern Ireland have distinct insolvency routes; this is not financial or legal advice."
