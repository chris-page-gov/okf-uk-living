inventory_version: exhaustive-reference-inventory.v1
status: owner_authorized_link_only
observed_at: "2026-08-07"

decision:
  authorized_by: owner:chris-page-gov
  authorized_at: "2026-08-07"
  scope: exhaustive_reference_family_inventory_for_the_proposed_life_course_bundle
  acquisition_mode: linked_reference_and_original_summary_only
  snapshots_acquired: false
  source_content_redistribution_allowed: false
  publication_allowed: false
  limitation: >-
    Authorization covers discovery and registration of external reference
    families. It does not authorize page snapshots, bulk extraction, source
    content redistribution, CI, GitHub Pages or publication.

denominator:
  interpretation: >-
    Exhaustive means every cell in the declared Phase 4 reference-family
    denominator is assessed. It does not mean that every live service page,
    provider or legal instrument has already been acquired.
  domains:
    - id: before-birth-and-starting-family
      title: Before birth and starting a family
    - id: birth-and-newborn
      title: Birth and the newborn period
    - id: early-years
      title: Early years
    - id: school-years
      title: School years
    - id: transition-to-adulthood
      title: Transition to adulthood
    - id: further-education-university-research
      title: Further education, university and research
    - id: finding-work-and-unemployment
      title: Finding work and unemployment
    - id: employment
      title: Employment
    - id: housing-and-community
      title: Housing and community life
    - id: rubbish-recycling-and-street
      title: Rubbish, recycling and the street
    - id: public-and-private-transport
      title: Public and private transport
    - id: transport-enforcement
      title: Transport enforcement
    - id: money-tax-and-benefits
      title: Money, tax and benefits
    - id: shopping-and-consumer-rights
      title: Shopping and consumer rights
    - id: relationships-and-family-change
      title: Relationships and family change
    - id: health-throughout-life
      title: Health throughout life
    - id: disability-care-and-support
      title: Disability, care and support
    - id: citizenship-democracy-and-rights
      title: Citizenship, democracy and rights
    - id: police-and-legal-services
      title: Police and legal services
    - id: starting-and-running-organisation
      title: Starting and running an organisation
    - id: ideas-creativity-and-research
      title: Ideas, creativity and research
    - id: holidays-volunteering-and-living-overseas
      title: Holidays, volunteering and living overseas
    - id: later-life
      title: Later life
    - id: death-and-bereavement
      title: Death and bereavement
  reference_jurisdictions:
    - uk-or-england
    - scotland
    - wales
    - northern-ireland
    - local
  expected_domain_jurisdiction_cells: 120
  cell_rule: >-
    A covered national cell identifies an authoritative discovery family, not
    a finished service route. A partial local cell identifies authority
    directories but still requires current responsible-provider pages.
  capability_dimensions:
    - authority_and_provider
    - jurisdiction_and_geography
    - ordinary_and_exception_routes
    - rules_rights_and_obligations
    - requirements_and_evidence
    - channels_costs_and_time
    - outcomes_and_redress
    - private_sector_dependencies
    - provenance_freshness_and_rights
    - ontology_curriculum_and_explorer
