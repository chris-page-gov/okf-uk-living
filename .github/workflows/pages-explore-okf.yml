name: Publish additive Explore OKF

on:
  workflow_dispatch:
    inputs:
      publication_commit:
        description: Exact protected-main merge commit to deploy
        required: true
      acknowledge_exploratory:
        description: Type EXPLORATORY-NOT-RELEASE-GRADE
        required: true

concurrency:
  group: okf-uk-living-pages-publication
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up locked Python toolchain
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Require exact reviewed main commit and explicit exploratory acknowledgement
        env:
          EXPECTED_PUBLICATION_COMMIT: ${{ inputs.publication_commit }}
          ACKNOWLEDGEMENT: ${{ inputs.acknowledge_exploratory }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_PUBLICATION_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PUBLICATION_COMMIT"
          test "$ACKNOWLEDGEMENT" = "EXPLORATORY-NOT-RELEASE-GRADE"
      - name: Verify deterministic Explore OKF sidecar
        run: uv run --locked python scripts/build_explore_okf.py --check
      - name: Promote frozen bytes plus the authorised Explore OKF overlay
        run: uv run --locked python scripts/prepare_explore_okf_publication.py --destination _site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload exact combined Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: package
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frozen preview with authorised Explore OKF review routes
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
