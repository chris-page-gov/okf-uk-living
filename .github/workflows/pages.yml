name: Publish GitHub Pages

# Retained as a historical record. The additive Explore OKF workflow is the
# only manual Pages deployment route; re-enabling this base-only transport
# could overwrite its public-review routes.
on: {}

concurrency:
  group: okf-uk-living-pages-publication
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require the reviewed main candidate
        env:
          EXPECTED_CANDIDATE_ID: ${{ inputs.candidate_id }}
          EXPECTED_PUBLICATION_COMMIT: ${{ inputs.publication_commit }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$EXPECTED_CANDIDATE_ID" = "life-course-population-complete-2026-08-08"
          test "$GITHUB_SHA" = "$EXPECTED_PUBLICATION_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PUBLICATION_COMMIT"
      - name: Promote exact frozen bytes
        run: python3 scripts/prepare_pages_publication.py --destination _site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: package
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frozen population preview
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
