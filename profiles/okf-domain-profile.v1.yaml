      to: fixture-contracts
      kind: governs
    - from: rights-decisions
      to: source-register
      kind: authorizes
    - from: consumer-lock
      to: vertical-slices
      kind: constrains
    - from: fixture-contracts
      to: vertical-slices
      kind: accepts
    - from: source-register
      to: vertical-slices
      kind: evidences
    - from: vertical-slices
