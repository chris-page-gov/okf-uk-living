consumer_lock:
  consumer: OKF Explorer small bundle
  schema: okf-explorer-bundle.v0
  okf_version: "0.2"
  corpus_id: okf-uk-living
  root: index.md
  bundle: okf-bundle.json
  invariants:
    - path-based node identifiers remain stable
    - ordinary browser-compatible Markdown links remain resolvable
    - compatibility relationships retain source and target identity
    - generated output remains deterministic for the same authored source
  status: provisional_pending_actual_consumer_inventory

